<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nar Games</title>
<meta name="description" content="Nar Games makes free-to-play mobile puzzle games.">
<style>
  :root { --bg:#ffffff; --fg:#1d1d1f; --muted:#5f6368; --accent:#c2410c; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121212; --fg:#ececec; --muted:#a0a4a8; --accent:#fb923c; --line:#2a2a2a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:720px; margin:0 auto; padding:64px 16px; }
  h1 { font-size:2.2rem; margin:0 0 4px; }
  h2 { font-size:1.2rem; margin:2rem 0 .5rem; padding-top:1rem; border-top:1px solid var(--line); }
  p { margin:.5rem 0; }
  a { color:var(--accent); }
  .tag { color:var(--muted); margin:0 0 1.5rem; }
</style>
</head>
<body>
<main>
  <h1>Nar Games</h1>
  <p class="tag">Free-to-play mobile puzzle games.</p>

  <h2>Games</h2>
  <p><strong>Ropedoku</strong> &mdash; a rope-sudoku puzzle game. <a href="privacy-policy/">Privacy Policy</a></p>

  <h2>Contact</h2>
  <p><a href="mailto:CONTACT_EMAIL_HERE">CONTACT_EMAIL_HERE</a></p>
</main>
</body>
</html>
